# 每次 push 與 pull request 都執行全部規則檢查（AGENTS.md 第 7、8 節）
name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      # 本儲存庫（競賽一）；完整歷史供 push 範圍檢查使用
      - uses: actions/checkout@v4
        with:
          path: AI_CUP_2026-2
          fetch-depth: 0
      # 競賽二的儲存庫須並排放置：本儲存庫使用它的 aicup 套件、特徵抽取與序列網路定義，以及它的環境設定
      - uses: actions/checkout@v4
        with:
          repository: bkttt0429/AI_CUP_2026-1
          path: AI_CUP_2026-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 環境與競賽二的儲存庫相同（固定版本見其 requirements.txt）；CI 用 CPU 版的 torch
      - name: 安裝套件
        working-directory: AI_CUP_2026-1
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt -r requirements-dev.txt
      # KataGo 的 Python 套件（2026-10-15 取用的 master，即 d91ea855），以 .pth 加入環境
      - name: KataGo Python 套件
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/lightvector/KataGo.git KataGo
          git -C KataGo sparse-checkout set python
          git -C KataGo checkout d91ea855110dae533f0aada947b2b7d78cc8a4e1
          echo "$PWD/KataGo/python" > "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')/katago.pth"
      - name: 規則檢查、ruff 與 pytest
        working-directory: AI_CUP_2026-2
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: bash tools/run_checks.sh --all
      # 直接 push 到 main 只能修改 docs/work/ 的工作檔；其他變更要走 pull request
      - name: push 到 main 的範圍
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: AI_CUP_2026-2
        run: python -I tools/check_code_rules.py --push-range "${{ github.event.before }}" "${{ github.sha }}"
