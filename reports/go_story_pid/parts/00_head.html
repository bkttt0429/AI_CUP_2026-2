<title>圍棋棋力預測報告</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 版面沿用使用者的太陽能板報告模板（封面＋報告卡＋推導彈窗＋簡報／閱讀／筆記三種模式；動畫都是 SVG <animate>，可拖曳進度條）。
   本報告沒有官方影像：右欄放動畫或圖表，左欄放文字、公式框、長條圖與「問題 → 作法 → 限制」。 */
:root{
  --bg:#f7f7f5; --paper:#fff; --ink:#1d1f24; --muted:#5d6370; --line:#d9dbe0;
  --accent:#0b6e69; --accent-soft:#e3f1ef; --warn:#a4451c; --warn-soft:#fbeee6;
  --hot:#d1343a; --blue:#0072b2; --gold:#b98900; --deriv:#f2f3f6;
  --stage-bg:#e9ebee; --backdrop:rgba(233,235,238,.82);
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
code{font-family:Consolas,monospace;font-size:13px;background:var(--deriv);padding:0 4px;border-radius:4px;word-break:break-all}
a{color:var(--accent)}
svg text{font-family:"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}

/* 頂列 */
.top{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:10px 20px;flex-wrap:wrap}
.top h1{font-size:15px;margin:0;font-weight:600}
.ch-menu-btn{padding:4px;margin:-4px;border:0;border-radius:5px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.ch-menu-btn:hover{background:var(--accent-soft)}
.ch-menu-caret{color:var(--muted);margin-left:3px}
.ch-menu-dlg{position:fixed;inset:52px auto auto 16px;margin:0;width:340px;max-width:calc(100vw - 16px);padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.ch-menu-dlg::backdrop{background:var(--backdrop)}
.ch-menu-dlg a{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;border-radius:5px;color:var(--ink);font-size:14px;text-decoration:none}
.ch-menu-dlg a:hover{background:var(--accent-soft);color:var(--accent)}
.ch-menu-dlg .meta{color:var(--muted);font-size:12px;flex-shrink:0}
.ch-menu-dlg hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.modes{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.modes button{border:0;background:transparent;color:var(--ink);padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);color:var(--paper)}
main{max-width:1180px;margin:0 auto;padding:24px 16px 90px}

/* 頁 */
.page{background:var(--paper);border:1px solid var(--line);border-radius:10px;margin:0 0 28px;position:relative;scroll-margin-top:70px}

/* 封面 */
.cover{padding:34px 38px 28px}
.kicker{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.04em}
.cover h2{font-size:29px;line-height:1.4;margin:8px 0 8px}
.cover h2 .brand{display:block;font-size:15px;color:var(--muted);font-weight:600}
.lead{color:var(--muted);margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0 18px}
.kpi{background:var(--accent-soft);border-radius:8px;padding:10px 14px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.warn{background:var(--warn-soft)}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 22px;background:var(--deriv);border-radius:8px;padding:12px 16px;margin:0 0 18px;font-size:14px}
.gloss h4{grid-column:1/-1;margin:0 0 2px;font-size:14px;color:var(--accent)}
.gloss div b{display:inline-block;min-width:6.5em}
.route{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.route li{display:flex;gap:12px;align-items:baseline;background:var(--accent-soft);border-radius:8px;padding:8px 14px}
.route li b{color:var(--accent);font-size:16px;min-width:3.2em}
.route li a{color:var(--ink);text-decoration:none}
.route li a:hover{color:var(--accent)}
.route li .c{margin-left:auto;color:var(--muted);font-size:12.5px;white-space:nowrap}
.metaline{margin-top:16px;font-size:13px;color:var(--muted);display:flex;gap:4px 18px;flex-wrap:wrap}
/* 封面只放標題，置中 */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:min(78vh,760px);padding:56px 64px}
.cover h2{font-size:64px;line-height:1.15;margin:0;letter-spacing:.04em}
.cover .cover-sub{margin:18px 0 0;font-size:18px;color:var(--muted)}   /* 分隔頁（1106 報告）的一行小字 */

/* 報告卡：左文右圖，圖欄比較寬 */
.report{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px;padding:22px 26px 18px;align-items:start}
.report.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.report>.anim.span{grid-column:1/-1;margin:0}   /* 第 8 頁：動畫橫跨整張卡，放大 */
.report>.anim.span .an-stage>svg{max-height:calc(100vh - 290px)}   /* 動畫占大部分畫面，整頁仍在一個畫面內 */
/* 橫跨整張卡的動畫：進度條放在動畫下方的留白，不蓋到動畫最底下的字 */
.report>.anim.span .an-stage{padding-bottom:40px}
.report>.anim.span .an-zone{height:40px}
.report>.anim.span .an-ctl{bottom:5px}
/* 第 8 頁上半部收緊，把空間讓給動畫 */
#card-decode .report{padding-top:12px;gap:10px 22px}
#card-decode .txt h3{margin:2px 0 6px}
#card-decode .key{margin:4px 0 6px}
#card-decode .key li{margin:2px 0}
#card-decode #chart-r1 h4{margin:0 0 4px}
#card-decode .anim.span .an-tech{margin-bottom:4px;padding:3px 9px}
.report>*{min-width:0}
.num{font-size:12px;color:var(--muted)}
.report h3{font-size:22px;line-height:1.4;margin:2px 0 12px;word-break:keep-all;overflow-wrap:anywhere}
.formula{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:0 0 12px;font-size:15px}
.formula .eq{font-size:17px;text-align:center;margin:2px 0 4px;font-weight:600}
.formula dl{display:grid;grid-template-columns:auto 1fr;gap:2px .7em;margin:6px 0 0;padding-top:6px;border-top:1px solid rgba(11,110,105,.22);font-size:13px;line-height:1.45}
.formula dt{font-weight:600}
.formula dd{margin:0;color:var(--muted)}
.report ul{margin:0;padding-left:20px}
.report li{margin:5px 0}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;margin-left:3px;vertical-align:1px;white-space:nowrap}
.t-m{background:#e3f4ea;color:#1d6b3e}.t-i{background:#fff1d6;color:#8a5a00}.t-p{background:#fde7e7;color:#9b2226}

/* 怎麼看右圖 */
.howto{background:#f3f8f7;border:1px solid #d3e7e3;border-radius:8px;padding:9px 13px 7px;margin:14px 0 0;font-size:14px;line-height:1.55}
.howto>b{display:block;font-size:13px;color:var(--accent);margin-bottom:3px}
.howto ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 18px}
.howto li{display:flex;gap:6px;align-items:center;margin:2px 0}
.howto li>span{flex:0 1 auto}
.howto .sw,.howto .bd,.howto .ztag{margin-top:0}
.report ul.key li{margin:7px 0}
.formula .eq.sub{font-size:15px;font-weight:500}
.sw{flex:none;display:inline-block;width:22px;height:14px;border:2.5px solid var(--c);border-radius:2px;background:#1b1e23;margin-top:3px}
.sw.dash{border-style:dashed}
.bd{flex:none;font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 3px;border-radius:10px;background:var(--c);color:var(--t,#fff);font-size:11px;font-weight:700;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3);margin-top:1px}
.ztag{flex:none;font-style:normal;display:inline-flex;align-items:center;justify-content:center;min-width:21px;height:19px;padding:0 4px;border:1.5px dashed #59606b;border-radius:3px;font-size:11.5px;font-weight:700;background:#fff;margin-top:1px}

/* 問題 → 作法 → 限制（放在左欄底部） */
.cause{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;border-top:1px dashed var(--line);padding-top:12px;margin-top:16px}
.cause .k{font-size:12px;color:#fff;background:var(--muted);border-radius:4px;padding:0 6px;margin-right:4px}
.cause .k.go{background:var(--accent)}.cause .k.stuck{background:var(--warn)}
.cause .arrow{color:var(--muted)}
.cause .bridge{flex:1 1 220px;font-size:13px;color:var(--accent)}
.cause.lim>span{flex-basis:100%}
/* 第 10 頁「到 0.98 要幾筆、多久」表：筆數長條深色到下限、淺色是範圍；把握分四色 */
.stg{font-size:.86em}
.stg td{vertical-align:middle;padding:5px 8px}
.stg td:nth-child(3){min-width:7.5em}
.stg tr.tot td{font-weight:700;background:var(--deriv)}
.stg-bar{display:flex;height:6px;background:#eef0f3;border-radius:3px;margin-top:3px;overflow:hidden}
.stg-bar i{display:block;height:100%;background:var(--warn)}
.stg-bar i:first-child{min-width:3px}
.stg-bar i.rg{background:#f3c9a8}
.cf{display:inline-block;font-size:.85em;font-weight:700;border-radius:10px;padding:0 8px;white-space:nowrap}
.c-hi{background:#e3f4ea;color:#1d6b3e}.c-mid{background:#fff1d6;color:#8a5a00}.c-lo{background:#fde7d9;color:#a4451c}.c-vlo{background:#fde7e7;color:#9b2226}
.deriv-open{flex:none;margin-left:auto;border:1px solid var(--accent);background:var(--paper);color:var(--accent);border-radius:16px;padding:3px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.deriv-open:hover{background:var(--accent);color:#fff}

/* 配圖 */
.fig{display:flex;flex-direction:column;gap:6px}
.fv{display:flex;flex-direction:column;gap:7px}
.fv+.fv{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.fv-ttl{font-size:13.5px;font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:2px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.stage{position:relative}
.stage.main{display:flex;justify-content:center;cursor:zoom-in}
.sv{position:relative;width:100%;border-radius:8px;overflow:hidden;background:#0b0d10;box-shadow:0 2px 12px rgba(20,30,40,.22)}
.sv svg,.inset svg{display:block;width:100%;height:auto}
.zoom-hint{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:12px;border-radius:12px;padding:1px 10px;pointer-events:none}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#ddd;font-size:13px;padding:20px;text-align:center;background:#111}
.err.show{display:flex}
.insets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.inset{margin:0}
.inset figcaption{font-size:12.5px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:6px;line-height:1.35}
.inset .stage{border-radius:7px;overflow:hidden;background:#0b0d10;box-shadow:0 1px 6px rgba(20,30,40,.2)}
.inset-cap{align-self:center;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12.5px;color:var(--muted)}
.legend label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none}
.legend i{display:inline-block;width:18px;border-top:3px solid}
.legend i.d{border-top-style:dashed}
.legend .focus-tg{margin-left:auto;color:var(--ink)}
.cap{font-size:12.5px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;border:1px solid var(--line);border-radius:12px;padding:1px 8px;color:var(--muted);background:var(--paper)}
.chip b{color:var(--ink);margin-right:3px}
/* 圖例：一行、淡底；補的「被塗黑的區域」「放大範圍」和圖層勾選並排 */
.legend{color:var(--ink);gap:4px 16px;padding:6px 10px;background:var(--deriv);border-radius:8px;align-items:center}
.legend i{width:22px}
.legend .lg-x{display:flex;align-items:center;gap:5px}
.legend .lg-x .ztag{margin:0}
.legend .lg-x b{display:inline-block;width:22px;height:12px;background:#0b0d10;border-radius:2px}
/* 放大圖放在主圖右側（左大右小），圖例與圖說橫跨底下 */
.fv:has(> .insets){display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);grid-template-areas:"main ins" "leg leg" "cap cap";gap:8px 12px;align-items:start}
.fv:has(> .insets)>.stage.main{grid-area:main}
.fv:has(> .insets)>.insets{grid-area:ins;grid-template-columns:1fr;gap:10px}
.fv:has(> .insets)>.legend{grid-area:leg}
.fv:has(> .insets)>.cap{grid-area:cap}
/* 每張卡左欄的動畫：一輪 9 秒（SVG <animate>；SIFT 用下面的 CSS 動畫） */
.anim{margin:14px 0 0;border:1px solid var(--line);border-radius:10px;padding:10px 12px 8px;background:#fff}
.anim svg{display:block;width:100%;height:auto}
.an-steps{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:.84em;margin:0 0 6px}
.an-steps span{white-space:nowrap}
.an-note{font-size:.74em;color:var(--muted);margin-top:4px}
.anim .an-k{font-size:13px;fill:#5d6370}
.anim .an-n{font-size:13px;font-weight:700;fill:#1d1f24}
.anim .an-t{font-size:14px;font-weight:700;fill:#1d1f24}
.anim .an-l{font-size:12px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#0b0d10;stroke-width:3px}
.anim .an-v{font-size:15px;font-weight:700}
.anim .an-ok{fill:#1d6b3e}
.anim .an-no{fill:#9b2226}
.anim .sift-t{font-size:13px;font-weight:700;fill:#1d1f24}
.anim .sift-c{font-size:11px;font-weight:700;fill:#fff;paint-order:stroke;stroke:#0b0d10;stroke-width:3px}
.anim .kp{fill:#ffd60a;stroke:#0b0d10;stroke-width:1}
.anim .ln{fill:none;stroke:#32d7ff;stroke-width:1.6}
.anim .ln.bad{stroke:#ff3b30;stroke-width:1.4}
.anim .vd{font-size:14px;font-weight:700}
.anim .vd.ok{fill:#1d6b3e}
.anim .vd.no{fill:#9b2226}
/* 「技術」：動畫上方一行，寫實際用的方法 */
.an-tech{display:flex;align-items:baseline;gap:8px;font-size:.8em;line-height:1.45;margin:0 0 6px;padding:5px 9px;border-radius:6px;background:var(--accent-soft)}
.an-tech b{flex:none;font-size:.88em;color:#fff;background:var(--accent);border-radius:4px;padding:0 6px}
/* 進度條：平常只露出底部一條細線；滑鼠移到動畫底部（或用鍵盤選到）才展開成控制列，不擋上方的字與按鈕。觸控裝置改放在動畫下方 */
.an-stage{position:relative}
.an-zone{position:absolute;left:0;right:0;bottom:0;height:56px}
.an-ctl{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px;padding:3px 12px 3px 5px;border-radius:999px;background:rgba(17,19,23,.8);color:#fff;font-size:12px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .18s,transform .18s}
.an-zone:hover .an-ctl,.an-ctl:focus-within,.anim.scrub .an-ctl{opacity:1;transform:none;pointer-events:auto}
.an-mini{position:absolute;left:0;bottom:0;width:0;height:3px;border-radius:0 2px 2px 0;background:#32d7ff;opacity:.65;pointer-events:none;transition:opacity .18s}
.an-zone:hover+.an-mini,.an-zone:focus-within+.an-mini,.anim.scrub .an-mini{opacity:0}
@media (hover:none){.an-zone{position:static;height:auto}.an-ctl{position:static;margin-top:6px;opacity:1;transform:none;pointer-events:auto}.an-mini{display:none}}
/* 第 8 頁動畫上方的分段按鈕（點了跳到那一段） */
.anim .an-chip{cursor:pointer}
.anim .an-chip:focus{outline:none}
.anim .an-chip:focus-visible rect{stroke:#32d7ff;stroke-width:2}
.anim .an-cl{font-size:12px;font-weight:700}
.anim .an-sv{font-size:16px;font-weight:700;fill:#fff}
.anim .an-sk{font-size:11px;fill:#c9ced6}
.an-pp{flex:none;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;color:#fff;font-size:12px;line-height:26px;cursor:pointer}
.an-pp:hover{background:rgba(255,255,255,.16)}
.an-seek{flex:1;min-width:0;height:18px;margin:0;accent-color:#32d7ff;cursor:pointer}
.an-time{flex:none;min-width:4.4em;text-align:right;font-variant-numeric:tabular-nums;opacity:.85}
/* 和官方圖合併的動畫放右欄（面板、裂紋、彩色熱影像） */
.fig>.anim{margin:0}
body.m-present .fig>.anim .an-stage>svg{max-height:calc(100vh - 300px)}
body.m-present .report>.anim.span .an-stage>svg{max-height:calc(100vh - 270px)}
@media print{.an-ctl{display:none}}

/* 大圖 */
.fig-dlg{padding:0;border:0;border-radius:10px;background:#0b0d10;max-width:98vw;max-height:98vh;overflow:auto}
.fig-dlg::backdrop{background:rgba(10,12,16,.8)}
.big-head{display:flex;gap:12px;align-items:center;padding:7px 14px;color:#e8eaed;font-size:14px}
.big-head .x{margin-left:auto;background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer}
.big-body svg{display:block;margin:0 auto 10px}

/* 圖表 */
.bars .row{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:4px 0;font-size:13px}
.bars .track{background:#eceef1;border-radius:4px;height:15px;overflow:hidden;display:flex}
.bars .fill{height:100%;border-radius:4px}
.bars .val{text-align:right;font-variant-numeric:tabular-nums}
.bars h4{font-size:13px;margin:12px 0 4px;color:var(--ink)}
.flow{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.flow .s{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px;flex:1 1 130px;background:var(--paper)}
.flow .s b{display:block;font-size:13px}
.flow .s.pub{border-color:#e7c46b;background:#fffaf0}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
th{background:var(--deriv);font-weight:600}
td.n,th.n{text-align:right}

/* 推導層 */
.lesson{display:none}
body.m-notes .lesson{display:block;background:var(--deriv);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;margin:-28px 0 28px;padding:6px 28px 22px}
.lesson h3{font-size:19px;margin:14px 0 4px}
.lesson h4{font-size:15.5px;margin:18px 0 6px}
.lesson .proves{font-size:13px;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px;margin:4px 0 12px}
.lesson-dlg{width:min(860px,calc(100vw - 24px));max-height:calc(100vh - 40px);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.lesson-dlg::backdrop{background:var(--backdrop)}
.dlg-head{position:sticky;top:0;background:var(--paper);display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line)}
.dlg-head .k{font-size:12px;color:var(--accent);font-weight:600}
.dlg-head .t{font-weight:600}
.dlg-head .x{margin-left:auto;border:0;background:transparent;font-size:18px;cursor:pointer}
.dlg-body{padding:4px 24px 18px}
.dlg-body h3:first-child{display:none}
.dlg-foot{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:8px 18px;display:flex;gap:8px;justify-content:flex-end}
.dlg-foot button{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}

/* 結論頁 */
